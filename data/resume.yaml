projects:
  - name: "Site LABGEM"
    description: "Site institucional do Laboratório de Genômica e Bioinformática (LABGEM) da Universidade Federal do Maranhão (UFMA), desenvolvido com Python, Flask e HTML/CSS. O site apresenta informações sobre o laboratório, seus membros, projetos de pesquisa, publicações e eventos. Ideal para divulgação científica e institucional do laboratório."
    github_link: "https://github.com/thallyson1997/site-labgem"
    deploy_link: "https://labgem-ufma.vercel.app/"
  - name: "MaraGo"
    description: "Aplicativo de turismo gamificado desenvolvido com Python, Flask e HTML/CSS, vencedor do Hackathon Trilhas 2025. O aplicativo permite que os usuários explorem pontos turísticos, participem de desafios e ganhem recompensas virtuais. Ideal para promover o turismo local e incentivar a exploração de novos lugares de forma divertida e interativa."
    deploy_link: "https://marago-frontend.vercel.app/"
  - name: "FUNCTION Functional Understanding of Novel Cluster associated Hypothetical prOTeiNs"
    description: "Aplicação web para anotação funcional de proteínas hipotéticas provenientes de clusters de biossíntese de metabólitos secundários (BGCs). A ferramenta consulta o InterProScan (EBI) contra múltiplos bancos de domínios (Pfam, SMART, PROSITE, PANTHER, Gene3D, SUPERFAMILY, CDD, HAMAP, entre outros) e apresenta os resultados em uma interface gráfica interativa, com cálculo de score de confiança, visualização de domínios e exportação dos resultados."
    github_link: "https://github.com/thallyson1997/FUNCTION_Functional_Understanding_of_Novel_Cluster-associated_Hypothetical_prOTeiNs"
    deploy_link: "https://anotador-funcional-proteico.onrender.com/anotador.html"
  - name: "Automatização de Documentação"
    description: "Projeto desenvolvido para automatizar a geração de documentação técnica e relatórios utilizando Python. Uma aplicação web para gerar automaticamente documentos Word com inserção de imagens em múltiplas páginas. Ideal para automatizar a criação de relatórios, documentações técnicas e formulários com layouts consistentes."
    github_link: "https://github.com/thallyson1997/Projeto_Automatizacao_de_Documentacao"
    deploy_link: "https://projeto-automatiza-documento.onrender.com/"
  - name: "ReSebo"
    description: "Projeto de aplicação web de sebos literários online, desenvolvida com Python, Flask e HTML/CSS. O projeto permite que usuários cadastrem livros, busquem por títulos e autores, e visualizem informações detalhadas sobre cada livro. Ideal para amantes da leitura que desejam encontrar sebos próximos ou explorar acervos literários de forma prática."
    github_link: "https://github.com/thallyson1997/ReSebo"
    deploy_link: "https://re-sebo.vercel.app/"
  - name: "Site de Desafios de Bioninformática"
    description: "Uma aplicação web com desafios de bioinformática, desenvolvida com Python, Flask e HTML/CSS. O site oferece desafios interativos para praticar habilidades em análise de sequências biológicas, utilizando ferramentas como Biopython e InterPro. Ideal para estudantes e profissionais da área de bioinformática que desejam aprimorar seus conhecimentos de forma prática."
    github_link: "https://github.com/thallyson1997/Site_de_Bioinformatica"
    deploy_link: "https://site-de-bioinformatica.onrender.com/"
  - name: "Detecção de Marcadores de Depressão em Postagem do Reddit"
    description: "Projeto de Conclusão do Curso utilizando linguagem de programação R e ferramentas de Processamento de Linguagem Natural (NLP) para analisar postagens do Reddit e identificar marcadores de depressão. O projeto envolveu coleta de dados, pré-processamento, análise exploratória e aplicação de modelos de aprendizado de máquina para classificação das postagens."
    github_link: "https://github.com/thallyson1997/Text_Mining_Depression"


about: >
  Profissional da área de Análise e Ciência de Dados, com formação em Engenharia da Computação e Ciência e Tecnologia pela UFMA. Experiência em análise de dados, Business Intelligence, automação de processos e desenvolvimento de soluções orientadas a dados, utilizando Python, SQL, Power BI, Tableau, Looker Studio, Pandas e Scikit-learn. Atuação com tratamento e visualização de dados, ETL, APIs REST, Machine Learning e desenvolvimento de dashboards para apoio à tomada de decisão. Experiência em projetos acadêmicos e profissionais, incluindo desenvolvimento de soluções em bioinformática e participação no MaraGo, aplicativo de turismo gamificado vencedor do Hackathon Trilhas 2025.


experiences:
  - role: "Estagiário em Ciência de Dados e Automação"
    company: "Secretaria de Estado de Administração Penitenciária do Maranhão (SEAP-MA)"
    period: "Out 2025 - Junho 2026"
    description: "Atuação na Supervisão de Fiscalização e Controle da Alimentação, com foco no monitoramento e análise de dados relacionados ao fornecimento de refeições nas unidades penitenciárias. Desenvolvimento do SGMRP (Sistema de Gerenciamento de Mapas de Refeições Penitenciário), uma plataforma web para centralização e gerenciamento das informações de fornecimento de refeições. Desenvolvimento de soluções utilizando Python, Flask, HTML, CSS, JavaScript, SQLite e SQLAlchemy, além da integração com bases de dados externas da SEAP. Automação de processos, tratamento e validação de dados, elaboração de relatórios e desenvolvimento de ferramentas para apoiar a fiscalização e a tomada de decisões."
  - role: "Analista de Dados e Gerenciamento de Redes Sociais"
    company: "Artistas em Rede"
    period: "Set 2023 - Mai 2024"
    description: "Atuação na análise de métricas de redes sociais, utilizando dados de alcance, engajamento e desempenho para apoiar decisões estratégicas. Desenvolvimento de relatórios e análises com Excel, Google Sheets e Meta Business Suite, além da utilização de Python e técnicas de Web Scraping para coleta e organização de dados. Participação na estruturação de indicadores, análise de tendências e geração de insights para melhoria das estratégias de conteúdo e desempenho digital."

